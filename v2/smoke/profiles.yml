# Proposed Redis v2 profile contract. Requires the Rust adapter in the dbt fork.
redis_dbt_v2_smoke:
  target: smoke
  outputs:
    smoke:
      type: redis_adbc
      driver: "{{ env_var('REDIS_ADBC_DRIVER', '') }}"
      uri: "{{ env_var('REDIS_URI', 'redis://localhost:6380/0') }}"
      username: "{{ env_var('REDIS_USERNAME', '') }}"
      password: "{{ env_var('REDIS_PASSWORD', '') }}"
      database: redis
      schema: "{{ env_var('REDIS_DBT_V2_SCHEMA') }}"
      threads: 2
