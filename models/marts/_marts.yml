version: 2

models:
  - name: fct_trips
    description: >
      One row per trip. Incremental with the merge strategy on trip_id: each
      run merges the trips picked up from `lookback_hours` before the latest
      one already in the table.
    columns:
      - name: trip_id
        data_tests: [unique, not_null]
      - name: pickup_location_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zones')
                field: location_id
      - name: fare_amount
        data_tests: [non_negative]
      - name: trip_distance
        data_tests: [non_negative]

  - name: dim_zones
    description: >
      Taxi zones with pickup/dropoff counts and pickup revenue. Built under an
      enforced model contract: dbt checks the column names and types, and the
      driver enforces the NOT NULL and CHECK constraints on every write.
    config:
      contract: {enforced: true}
    columns:
      - name: location_id
        data_type: bigint
        constraints: [{type: not_null}, {type: primary_key}]
        data_tests: [unique, not_null]
      - {name: borough, data_type: varchar}
      - {name: zone_name, data_type: varchar}
      - {name: service_zone, data_type: varchar}
      - {name: is_airport, data_type: boolean}
      - name: pickups
        data_type: bigint
        constraints: [{type: not_null}, {type: check, expression: "pickups >= 0"}]
      - name: dropoffs
        data_type: bigint
        constraints: [{type: not_null}, {type: check, expression: "dropoffs >= 0"}]
      - {name: pickup_revenue, data_type: double precision}

  - name: agg_zone_daily
    description: >
      Trips and revenue per pickup zone and day. Incremental with the
      composite key (pickup_date, pickup_location_id) and the default
      delete+insert strategy.
    columns:
      - name: pickup_date
        data_tests: [not_null]
      - name: pickup_location_id
        data_tests: [not_null]

  - name: agg_daily_revenue
    description: >
      Trips, passengers, miles and revenue per pickup date, with window
      functions over the days: a 7-day rolling revenue average, the change in
      trips from the previous day, and the day's revenue rank.
    columns:
      - name: pickup_date
        data_tests: [unique, not_null]
      - name: trips
        data_tests:
          - in_range:
              arguments: {min_value: 1, max_value: 1000000}
      - name: revenue_7d_avg
        description: Average total_revenue over this day and the 6 before it.
        data_tests: [not_null]
      - name: trips_vs_prev_day
        description: trips minus the previous day's trips (NULL on the first day).
      - name: revenue_rank
        data_tests:
          - in_range:
              arguments: {min_value: 1, max_value: 31}

  - name: agg_top_pickup_zones
    description: The busiest pickup zones of each borough (RANK() per borough, filtered with QUALIFY).
    columns:
      - name: borough_rank
        data_tests:
          - in_range:
              arguments: {min_value: 1, max_value: "{{ var('top_zones_per_borough') }}"}

  - name: agg_hourly_demand
    description: Average demand, trip length, speed and fare by hour of pickup across the month.
    columns:
      - name: pickup_hour
        data_tests: [unique, not_null]

  - name: agg_borough_flows
    description: Trips between boroughs with at least 25 trips (GROUP BY ... HAVING).

  - name: agg_payment_mix
    description: Share of trips and tips by payment type (SUM(COUNT(*)) OVER () for the total).
    columns:
      - name: payment_type_id
        data_tests: [unique]

  - name: agg_airport_trips
    description: Trips to and from JFK, LaGuardia and Newark.
