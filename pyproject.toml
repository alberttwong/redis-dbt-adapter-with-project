[project]
name = "redis-dbt-nyc-taxi"
version = "0.1.0"
description = "dbt Core project on Redis 8 via the Redis ADBC driver, using NYC TLC yellow taxi trips"
requires-python = ">=3.10,<3.14"
dependencies = [
    "dbt-core>=1.10,<2",
    "dbt-redis-adbc",
]

[tool.uv]
package = false

[tool.uv.sources]
dbt-redis-adbc = { path = "adapter", editable = true }
