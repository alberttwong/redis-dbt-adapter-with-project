[project]
name = "redis-dbt-nyc-taxi"
version = "0.1.0"
description = "dbt Core project on Redis 8 via the Redis ADBC driver, using NYC TLC yellow taxi trips"
requires-python = ">=3.10,<3.14"
dependencies = [
    "dbt-core>=1.10.8,<2",
    "dbt-redis-adbc",
]

# dbt's adapter test suite (adapter/tests/functional): uv run pytest
[dependency-groups]
dev = [
    "dbt-tests-adapter>=1.20,<2",
    "pandas>=2",
    "polars>=1",
    "pytest>=8",
    "pytest-xdist>=3",
]

[tool.uv]
package = false

[tool.uv.sources]
dbt-redis-adbc = { path = "adapter", editable = true }

[tool.pytest.ini_options]
testpaths = ["adapter/tests/functional"]
addopts = "--strict-markers"
# The suite's own fixtures, not ours.
filterwarnings = ["ignore:Class-scoped fixture defined as instance method:pytest.PytestRemovedIn10Warning"]
