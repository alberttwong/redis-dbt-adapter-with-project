[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbt-redis-adbc"
version = "0.1.0"
description = "dbt adapter for Redis 8.x using the Redis ADBC driver"
requires-python = ">=3.10"
dependencies = [
    "dbt-core>=1.10,<2",
    "dbt-adapters>=1.16,<2",
    "adbc-driver-manager>=1.6",
    "pyarrow>=18",
]

[tool.hatch.build.targets.wheel]
packages = ["dbt"]
