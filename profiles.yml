nyc_taxi:
  target: dev
  outputs:
    dev:
      type: redis_adbc
      # Built by scripts/build_driver.sh (libadbc_driver_redis.so on Linux).
      driver: "{{ env_var('REDIS_ADBC_DRIVER', 'driver/libadbc_driver_redis.dylib') }}"
      uri: "{{ env_var('REDIS_URI', 'redis://localhost:6380/0') }}"
      database: redis
      schema: taxi
      threads: 4
