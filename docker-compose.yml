services:
  redis:
    # Redis 8.x ships the Query Engine (RediSearch) the driver requires.
    image: redis:8.4
    container_name: redis-dbt-taxi
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
